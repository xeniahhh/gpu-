<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">KV 准入与副本故障的请求终态</title>
  <desc id="desc">业务拒绝和失败是有效结果，不等同于仿真服务器异常。</desc>
  <rect x="0" y="0" width="1000" height="520" rx="0" fill="#f3f6f8" stroke="none" stroke-width="0" opacity="1"/>
  <text x="56" y="58" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#18364f" text-anchor="start">KV 准入与副本故障的请求终态</text>
  <text x="56" y="83" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#c76823" text-anchor="start">Qwen2.5-7B TP 案例 | 数据来源 SYNTHETIC | 不是 GPU 实测</text>
  <line x1="56" y1="105" x2="944" y2="105" stroke="#d8e1e6" stroke-width="1"/>
  <text x="105" y="160" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#18364f" text-anchor="start">T2 KV 准入</text>
<rect x="105" y="180" width="350" height="34" rx="3" fill="#31845f" stroke="none" stroke-width="0" opacity="1"/>
<text x="280" y="203" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">完成 1</text>
<rect x="455" y="180" width="350" height="34" rx="3" fill="#c76823" stroke="none" stroke-width="0" opacity="1"/>
<text x="630" y="203" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">KV 拒绝 1</text>
<text x="105" y="275" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#18364f" text-anchor="start">T3 副本故障</text>
<rect x="105" y="295" width="525" height="34" rx="3" fill="#31845f" stroke="none" stroke-width="0" opacity="1"/>
<text x="367.5" y="318" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">完成 3</text>
<rect x="630" y="295" width="175" height="34" rx="3" fill="#b6504b" stroke="none" stroke-width="0" opacity="1"/>
<text x="717.5" y="318" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">失败 1</text>
<text x="105" y="420" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#233a4c" text-anchor="start">T3 同时记录 1 个旧回调被忽略，失败请求不产生幽灵 token。</text>
  <text x="56" y="490" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#617385" text-anchor="start">证据：T2_kv_reject 与 T3_fault 的 result、metrics 和 checks。</text>
</svg>
