<text x="100" y="459" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#617385" text-anchor="start">TTFT 增至 1.228 倍；尾时延增至 1.126 倍。</text>
  <text x="56" y="490" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#617385" text-anchor="start">证据：T2_A_alone 与 T2_pair_control；两组请求长度、TP 大小和放置保持固定。</text>
